name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamelog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: sh mvnw -B test
